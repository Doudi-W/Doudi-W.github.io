<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doudi-W 的个人主页</title>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .title {
            color: #718096;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 30px;
            border-radius: 3px;
        }

        .info {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #f7fafc;
            color: #2d3748;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-size: 16px;
            cursor: pointer;
        }

        .link-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .footer {
            margin-top: 40px;
            color: #a0aec0;
            font-size: 14px;
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            .card {
                padding: 40px 25px;
            }
            h1 {
                font-size: 26px;
            }
            .link-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 头像 -->
        <div class="avatar">D</div>
        
        <!-- 名字和头衔 -->
        <h1>Doudi-W</h1>
        <p class="title">计算机科学与技术 | 2402班</p>
        
        <div class="divider"></div>
        
        <!-- 个人介绍 -->
        <div class="info">
            热爱计算机网络与后端开发<br>
            正在学习服务器搭建、Web开发与算法<br>
            记录学习路上的每一步
        </div>
        
        <!-- 链接按钮 -->
        <div class="links">
            <a href="https://github.com/Doudi-W" class="link-btn" target="_blank">
                <i class="fa fa-github"></i> GitHub
            </a>
            <!-- 点击复制邮箱按钮（文字显示"邮箱"，地址隐藏） -->
            <a href="javascript:void(0)" class="link-btn" onclick="copyEmail()">
                <i class="fa fa-envelope"></i> 邮箱
            </a>
            <a href="notes.html" class="link-btn">
                <i class="fa fa-book"></i> 学习笔记
            </a>
        </div>
        
        <!-- 页脚 -->
        <div class="footer">
            © 2026 Doudi-W | Powered by GitHub Pages
        </div>
    </div>

    <!-- 邮箱复制功能脚本（地址写在这里，页面上看不到） -->
    <script>
        function copyEmail() {
            navigator.clipboard.writeText("2813809717@qq.com");
            alert("邮箱已复制到剪贴板！");
        }
    </script>
</body>
</html>
